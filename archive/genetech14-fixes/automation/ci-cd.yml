# GeneTech 14站知识引擎 — CI/CD Pipeline
#
# 功能：
# 1. 数据一致性检查（每次推送）
# 2. 自动化数据更新（每日定时）
# 3. 安全扫描（密钥泄露检测）
# 4. 自动部署到 Cloudflare Pages
#
# 设置步骤：
# 1. 在 GitHub 仓库 Settings > Secrets 中添加：
#    - CLOUDFLARE_API_TOKEN
#    - CLOUDFLARE_ACCOUNT_ID
#    - PROJECT_ROOT（可选，默认为仓库根目录）
# 2. 将本文件复制到 .github/workflows/ci-cd.yml
# 3. 根据需要调整 cron 表达式

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每天北京时间凌晨 3 点执行数据更新
    - cron: '0 19 * * *'  # UTC 19:00 = Beijing 03:00
  workflow_dispatch:  # 支持手动触发

env:
  NODE_VERSION: '20'
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  # === 任务 1：安全扫描 ===
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于扫描

      - name: Detect Secrets
        uses: Yelp/detect-secrets-action@v1
        with:
          baseline: .secrets.baseline
          detect_all_files: true

      - name: Check for CREDENTIALS.md
        run: |
          if [ -f "CREDENTIALS.md" ]; then
            echo "::error::CREDENTIALS.md 文件存在！请立即删除并轮换所有凭证。"
            exit 1
          fi

      - name: Check for hardcoded paths
        run: |
          if grep -r "/home/z/my-project" --include="*.js" --include="*.py" .; then
            echo "::warning::发现硬编码路径 /home/z/my-project，请运行 fix-portability.js"
          fi

  # === 任务 2：数据一致性检查 ===
  data-consistency:
    name: Data Consistency Check
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run consistency check
        run: |
          node genetech14-fixes/data-integrity/fix-data-consistency.js --all --project-root .

      - name: Upload consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-report
          path: genetech14-fixes/data-integrity/consistency-report.json

  # === 任务 3：自动化数据更新（仅定时触发）===
  data-update:
    name: Automated Data Update
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: data-consistency
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          pip install requests

      - name: Run data mining pipeline
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          # 按顺序执行数据采集脚本
          for site in genetech-tools tcm-tools agent-ecosystem robot-parts quantum-computing brain-science nuclear-energy exo-science alien-minerals deep-sea-tech new-energy life-science biocomputing bionic-ai; do
            echo "Processing $site..."
            # 这里调用实际的采集脚本
            # node kb-workflow/deep-mine/mine.js "$site" || echo "Warning: $site mining failed"
          done

      - name: Rebuild API data
        run: |
          node kb-workflow/deep-mine/rebuild.js

      - name: Commit updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "chore: automated data update $(date -u +'%Y-%m-%d')"
          git push

  # === 任务 4：部署到 Cloudflare Pages ===
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [data-consistency]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        site:
          - { dir: genetech-tools, project: genetech-tools }
          - { dir: tcm-tools, project: tcm-tools }
          - { dir: agent-ecosystem, project: agentecosystem }
          - { dir: robot-parts, project: robotparts }
          - { dir: quantum-computing, project: quantumcomputing }
          - { dir: brain-science, project: brainscience }
          - { dir: nuclear-energy, project: nuclearenergy }
          - { dir: exo-science, project: exoscience }
          - { dir: alien-minerals, project: alienminerals }
          - { dir: deep-sea-tech, project: deepseatech }
          - { dir: new-energy, project: newenergy }
          - { dir: life-science, project: lifescience }
          - { dir: biocomputing, project: biocomputedb }
          - { dir: bionic-ai, project: bionicai }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy ${{ matrix.site.dir }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.site.dir }}/website --project-name=${{ matrix.site.project }}

  # === 任务 5：健康检查 ===
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check all sites
        run: |
          sites=(
            "https://genetech.tools"
            "https://tcm.genetech.tools"
            "https://agent.genetech.tools"
            "https://robot.genetech.tools"
            "https://quantum.genetech.tools"
            "https://brain.genetech.tools"
            "https://nuclear.genetech.tools"
            "https://exo.genetech.tools"
            "https://mineral.genetech.tools"
            "https://deepsea.genetech.tools"
            "https://energy.genetech.tools"
            "https://life.genetech.tools"
            "https://biocompute.genetech.tools"
            "https://bionicai.genetech.tools"
          )

          failed=0
          for url in "${sites[@]}"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" != "200" ]; then
              echo "::error::$url returned $status"
              failed=1
            else
              echo "✓ $url OK"
            fi
          done

          if [ $failed -eq 1 ]; then
            exit 1
          fi
