name = "genetech-api-guard"
main = "worker.js"
compatibility_date = "2024-09-23"

# 免费层每 IP 每分钟请求上限
[vars]
PRO_FREE_RATE = "60"
# 可选：指向 unified-license Worker 的 validate 端点，打通 GUX_ 统一许可证
# LICENSE_VALIDATE_URL = "https://license.genetech.io/api/license/validate"
# LICENSE_API_SECRET = "..."

# 限流 KV（在 Cloudflare 控制台创建 KV 命名空间后填入 id）
[[kv_namespaces]]
binding = "PRO_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 部署：wrangler deploy
# 注入密钥（不要写进文件）：wrangler secret put PRO_SECRET
