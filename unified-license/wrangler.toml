# ============================================================================
# GeneTech 14站知识引擎 — 统一许可证中心 Worker 配置
# ============================================================================
#
# 部署步骤：
#   1. 安装 wrangler：npm install -g wrangler （或使用 npx）
#   2. 登录：npx wrangler login
#   3. 创建 KV 命名空间：
#        npx wrangler kv namespace create UNIFIED_LICENSES
#      将返回的 id 填入下方 [[kv_namespaces]] 的 id 字段
#   4. 配置 Secrets（切勿写入本文件）：
#        npx wrangler secret put ADMIN_SECRET
#        npx wrangler secret put HUPIJIAO_APP_ID
#        npx wrangler secret put HUPIJIAO_APP_SECRET
#   5. 部署：npx wrangler deploy
#   6. 记录部署后的 Worker URL（如 https://unified-license.<account>.workers.dev）
#      或绑定自定义域名 license.genetech.io
#      将此 URL 配置到每个站点的环境变量 / verify.js 的 UNIFIED_API
# ============================================================================

name = "unified-license"
main = "worker.js"
compatibility_date = "2024-09-23"

# === KV 命名空间绑定 ===
# 存储全部统一许可证数据：
#   license:<GUX_KEY>   许可证对象
#   email:<sha256>      邮箱哈希反查索引
#   meta:stats          聚合统计
#   rl:<ip>:<minute>    速率限制计数（TTL 120s）
[[kv_namespaces]]
binding = "UNIFIED_LICENSES"
id = "__KV_UNIFIED_LICENSES_ID__"
# preview_id 仅在 wrangler dev 本地开发时使用，可留空
# preview_id = "__KV_UNIFIED_LICENSES_PREVIEW_ID__"

# === 环境变量（非敏感） ===
# 敏感变量（ADMIN_SECRET / HUPIJIAO_APP_ID / HUPIJIAO_APP_SECRET）必须通过
# `wrangler secret put` 配置，不要写在此文件中！
[vars]
# 允许兑换的 14 个站点名（逗号分隔，小写）。
# 与各站点 SITE_NAME 保持一致；redeem 时会校验站点名是否在此列表内。
ALLOWED_SITES = "site1,site2,site3,site4,site5,site6,site7,site8,site9,site10,site11,site12,site13,site14"

# CORS 允许的来源（逗号分隔）。默认在 worker.js 中内置 14 个 genetech.io 子域。
# 如需覆盖，取消注释并填入真实域名（含 https://）：
# ALLOWED_ORIGINS = "https://site1.genetech.io,https://site2.genetech.io,..."

# === 虎皮椒国内支付（微信 / 支付宝）===
# 敏感凭据 APPID / APPSECRET 必须通过 wrangler secret put 注入，切勿写入本文件！
#   npx wrangler secret put HUPIJIAO_APP_ID
#   npx wrangler secret put HUPIJIAO_APP_SECRET
# 单通道时只需上面两个 secret；若同时有微信 + 支付宝两个渠道（各自 appid/appsecret），
# 则用 HUPIJIAO_CHANNELS（JSON 数组）配置，worker 会自动识别回调来自哪个通道：
# HUPIJIAO_CHANNELS = '[{"key":"wechat","appid":"...","appsecret":"...","label":"微信支付"},{"key":"alipay","appid":"...","appsecret":"...","label":"支付宝"}]'
# 套餐 -> 人民币价格（元，decimal(18,2)），可在此覆盖：
HUPIJIAO_PRICE_MAP = '{"starter":"9.90","pro":"39.90","lifetime":"199.00"}'
# 可选：覆盖回调 / 跳转地址（默认从请求域名自动推导，无需配置）
# HUPIJIAO_NOTIFY_URL = "https://unified-license.<your-subdomain>.workers.dev/api/hupijiao/callback"
# HUPIJIAO_RETURN_URL = "https://license.genetech.io/pay/success"

# === 可选：自定义路由 ===
# 如需绑定自有域名（推荐 license.genetech.io），取消注释并配置：
# routes = [
#   { pattern = "license.genetech.io/*", custom_domain = true }
# ]
# 或使用 zone 方式：
# routes = [
#   { pattern = "license.genetech.io/*", zone_name = "genetech.io" }
# ]

# === 注意事项 ===
# 1. ADMIN_SECRET：管理员发行许可证的密钥，调用 /api/admin/issue 时用于 HMAC 签名
# 2. 本 Worker 是全部 14 站的许可证权威，部署后 URL 需告知所有站点
# 4. KV 有最终一致性，统计接口（meta:stats）与速率限制可能有数秒延迟
# 5. 免费版 Cloudflare Workers 每日 100,000 次请求；站点侧 site-adapter.js
#    已做 1 小时本地缓存，可大幅降低中央 Worker 调用量
# 6. 如需更严格的速率限制，建议叠加 Cloudflare Dashboard 的原生 Rate Limiting 规则
