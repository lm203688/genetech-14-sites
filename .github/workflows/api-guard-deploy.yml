# GeneTech 14站知识引擎 — API 鉴权 Worker 自动部署
# 文件位置: .github/workflows/api-guard-deploy.yml
#
# 设计目标：把"部署付费墙 Worker"从人工步骤变成**密钥门控的自动化流水线**。
#   - 仅当仓库配置了 Secrets: CLOUDFLARE_API_TOKEN 与 PRO_SECRET 时才执行部署；
#   - 二者缺失时本作业静默跳过（exit 0），不报错、不建 Issue、不打扰用户。
#   - 一旦配置好，push（api-guard 变更）或每日定时都会自动重新部署，实现"持续运营"。
#
# 部署方式：直接使用 Cloudflare REST API（api-guard/deploy-api.mjs），不依赖 wrangler，
# 避免 CI 中 wrangler 安装/PATH/模块上传格式等不稳定因素。已实测可成功部署。
#
# 用户一次性配置（之后不再需要手动操作）：
#   1. Cloudflare 控制台 → My Profile → API Tokens → Create Token（Custom token）
#      权限：Account > Workers Scripts:Edit + Account > KV Storage:Edit
#      Account Resources: Include > All accounts
#      存入仓库 Secrets: CLOUDFLARE_API_TOKEN（cf_ 开头）
#      → Account ID 会自动从 token 反查；若反查失败，可额外配置 Secrets: CLOUDFLARE_ACCOUNT_ID
#   2. 把 PRO_SECRET（付费墙签名密钥）存入仓库 Secrets: PRO_SECRET
#      （本项目生成的密钥为 18b038764e967102e86ef87629e1ce4dea2ee5e3fb82512bf5ebcc3a7a625fe2）

name: GeneTech API Guard Deploy

on:
  push:
    paths:
      - 'api-guard/**'
      - '.github/workflows/api-guard-deploy.yml'
  schedule:
    # 每日 03:30 UTC 确保 Worker 保持部署状态
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-guard-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRO_SECRET: ${{ secrets.PRO_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查密钥是否已配置
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$PRO_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ api-guard 自动部署未启用：在仓库 Secrets 配置 CLOUDFLARE_API_TOKEN 与 PRO_SECRET 后自动生效（无需手动运行）。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy API Guard Worker (Cloudflare REST API)
        if: steps.check.outputs.configured == 'true'
        working-directory: api-guard
        run: node deploy-api.mjs
