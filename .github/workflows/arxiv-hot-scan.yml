name: ArXiv Hot Scan
on:
  schedule:
    - cron: '15 0,4,8,12,16,20 * * *'  # 每 4 小时（00:15 UTC = 08:15 CST）
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch arXiv hot papers
        run: node operations-plan/pipeline-arxiv-hot.mjs
      - name: Commit results
        run: |
          git config user.email bot@genetech.local
          git config user.name GeneTech Bot
          git add data/arxiv-hot.json
          git diff --cached --quiet || git commit -m "chore(arxiv): refresh hot scan $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push || echo "no changes"
