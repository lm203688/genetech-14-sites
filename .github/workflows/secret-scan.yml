name: Secret Scan

# 由来：2026-09-16 提交 95caf35 把真实 GATEWAY_SECRET 明文写进本 public 仓库的
# README.md / _test.mjs，任何人都能读到并据此自签 slb_ key（2026-09-18 复盘）。
# unified-license/DEPLOY-SECRETS.md 早有告诫，仍未防住 —— 「写在文档里」不是机制。
# 本 workflow 把该规则变成阻断式门禁（fail-closed，扫到即红）。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: 明文密钥扫描 (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 扫描仓库明文密钥
        run: node tools/scan-secrets.mjs
