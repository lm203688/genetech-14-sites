# GeneTech 14站知识引擎 — GitHub Actions 自动化运营配置
# 文件位置: .github/workflows/ops.yml
#
# 功能说明:
#   本 Workflow 将 5 个运营闭环 pipeline 自动化部署到 GitHub Actions 云端环境，
#   实现无服务器定时运营。支持 schedule 自动触发、workflow_dispatch 手动触发、
#   以及各 pipeline 的独立触发。
#
# 触发方式:
#   1. 定时自动触发（按各 pipeline 的频率设定）
#   2. 手动触发: GitHub 仓库页面 -> Actions -> 选择 workflow -> Run workflow
#   3. push 到 main 分支时验证脚本语法
#
# 环境要求:
#   - Ubuntu Latest
#   - Node.js 20
#   - 需要配置以下 Secrets:
#       GITHUB_TOKEN        (默认提供，用于 GitHub API 访问)
#       INDEXNOW_KEY        (可选，用于 IndexNow SEO 提交)
#       INDEXNOW_KEY_LOCATION (可选)
#       SITE_BASE_URL       (可选，默认 https://genetech.example)

name: GeneTech Operations Automation

on:
  # 手动触发，支持选择运行哪个 pipeline
  workflow_dispatch:
    inputs:
      pipeline:
        description: '选择要运行的 Pipeline'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - data-accumulation
          - domain-expansion
          - tech-adoption
          - promotion
          - intelligence
      dry_run:
        description: '是否以 Dry-Run 模式运行（不写入实际数据）'
        required: false
        default: false
        type: boolean

  # 定时触发：与 scheduler.js 中的时间表对应，使用 UTC 时间
  schedule:
    # ===== 临时提升期（2026-08-05 ~ 2026-08-30）=====
    # 数据收集涡轮：每 30 分钟一次（48次/天），尽快扩充实体数据库（核心竞争力）
    #   频率经限流测算确定，勿随意调高（详见 operations-plan/RATE-LIMIT-BUDGET.md）：
    #   - arXiv 官方要求 >=3s/请求，'*/5' 会达 2.8万次/天必被封 IP；'*/30' 降至 4.7k/天安全
    #   - PubMed E-utilities 无 key 限 3 req/s，'*/5' 达 5.6万/天会触发 NCBI 封禁
    #   - OpenAlex 礼貌池 10万/天，'*/30' 用量仅 4.7%
    #   提速靠“抓得深”而非“抓得勤”：单次 limit=150 + 游标分页，单轮产出是原来的 5 倍
    #   仅触发 data-accumulation 闭环（decide 步骤按 github.event.schedule 识别）
    #   2026-08-07 修正：单轮数据任务实际耗时已达 35-50 分钟（6 数据源 × 22 站），
    #   而 concurrency 组只保留 1 个排队位——'*/30' 会让第三轮到达时把排队中的那轮 cancel 掉，
    #   表现为持续的 "prepare => cancelled" 假失败。改为整点每小时一轮，与实际耗时匹配。
    - cron: '0 * * * *'
    # 其余闭环：每日 20:30 CST(12:30 UTC) 一次全量运行
    # 恢复原始分时段配置时，删除上方 '*/5 * * * *' 与下方 '30 12 * * *' 两行，
    # 替换为以下 5 行（并删除 decide 步骤中的“提升期”与“数据涡轮”分支）：
    #   - cron: '0 18 * * *'   # 数据积累 每日 02:00 UTC+8
    #   - cron: '0 22 * * 0'   # 领域开拓 周日 22:00 UTC
    #   - cron: '0 20 * * 2'   # 技术采纳 周二 20:00 UTC
    #   - cron: '0 0,10 * * *' # 推广 每日 00:00,10:00 UTC
    #   - cron: '0 21 * * 4'   # 情报 周四 21:00 UTC
    - cron: '30 12 * * *'

  # push 到 main 分支时进行验证
  push:
    branches: [main, master]
    paths:
      - 'operations-plan/**'
      - 'sites/**'
      - '.github/workflows/ops.yml'

# 权限配置
permissions:
  contents: write
  actions: read
  issues: write

# 并发控制：同一 pipeline 同时只能有一个实例在运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pipeline || 'scheduled' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  SCRIPTS_DIR: 'operations-plan'
  REPORTS_DIR: 'reports'
  LOGS_DIR: 'logs'
  STATE_DIR: 'state'

jobs:
  # ==================== 前置准备 ====================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run_data: ${{ steps.decide.outputs.should_run_data }}
      should_run_domain: ${{ steps.decide.outputs.should_run_domain }}
      should_run_tech: ${{ steps.decide.outputs.should_run_tech }}
      should_run_promo: ${{ steps.decide.outputs.should_run_promo }}
      should_run_intel: ${{ steps.decide.outputs.should_run_intel }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache state and reports
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STATE_DIR }}
            ${{ env.REPORTS_DIR }}
            ${{ env.LOGS_DIR }}
          key: genetech-ops-state-${{ github.run_id }}
          restore-keys: |
            genetech-ops-state-

      - name: Decide which pipelines to run
        id: decide
        run: |
          PIPELINE="${{ github.event.inputs.pipeline || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          # 默认全部不运行
          echo "should_run_data=false" >> $GITHUB_OUTPUT
          echo "should_run_domain=false" >> $GITHUB_OUTPUT
          echo "should_run_tech=false" >> $GITHUB_OUTPUT
          echo "should_run_promo=false" >> $GITHUB_OUTPUT
          echo "should_run_intel=false" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT

          # 根据 cron 或手动输入决定
          if [[ "$PIPELINE" == "all" ]]; then
            # 定时触发时，根据当前 UTC 时间判断
            HOUR=$(date -u +%H)
            DOW=$(date -u +%w)  # 0=Sunday
            SCHED="${{ github.event.schedule }}"
            TODAY=$(date -u +%Y-%m-%d)

            # ===== 临时提升期（2026-08-05 ~ 2026-08-30）=====
            # 注意：提升期分支与原始分时段判定必须互斥，否则 */30 涡轮会在
            # 00:xx/10:xx 额外触发 promo、周日22:xx/周二20:xx/周四21:xx 额外触发
            # domain/tech/intel，架空“涡轮只跑 data”的设计并多耗额度。
            if [[ "$TODAY" > "2026-08-30" ]]; then
              echo "[Decide] 提升期已过($TODAY > 2026-08-30)，回退到原始分时段判定（等待 8-31 还原自动化恢复原始 cron）"
              # ===== 原始分时段调度判定 =====
              # 数据积累: 18:00 UTC (02:00 UTC+8)
              if [[ "$HOUR" == "18" ]]; then
                echo "should_run_data=true" >> $GITHUB_OUTPUT
              fi
              # 领域开拓: 22:00 UTC Sunday (06:00 UTC+8 Monday)
              if [[ "$HOUR" == "22" && "$DOW" == "0" ]]; then
                echo "should_run_domain=true" >> $GITHUB_OUTPUT
              fi
              # 技术采纳: 20:00 UTC Tuesday (04:00 UTC+8 Wednesday)
              if [[ "$HOUR" == "20" && "$DOW" == "2" ]]; then
                echo "should_run_tech=true" >> $GITHUB_OUTPUT
              fi
              # 推广: 00:00, 10:00 UTC (08:00, 18:00 UTC+8)
              if [[ "$HOUR" == "00" || "$HOUR" == "10" ]]; then
                echo "should_run_promo=true" >> $GITHUB_OUTPUT
              fi
              # 情报: 21:00 UTC Thursday (05:00 UTC+8 Friday)
              if [[ "$HOUR" == "21" && "$DOW" == "4" ]]; then
                echo "should_run_intel=true" >> $GITHUB_OUTPUT
              fi
            # 数据收集涡轮：每 30 分钟仅跑 data-accumulation，尽快扩充实体数据库
            elif [[ "$SCHED" == "*/30 * * * *" ]]; then
              echo "should_run_data=true" >> $GITHUB_OUTPUT
              echo "[Decide] 数据涡轮: 每30分钟深度采集(data only)"
            # 每日 20:30 CST = 12:30 UTC 全量运行（推广由 ops-extra 的 geo 任务承担，避免同刻双跑）
            elif [[ "$HOUR" == "12" ]]; then
              echo "should_run_data=true" >> $GITHUB_OUTPUT
              echo "should_run_domain=true" >> $GITHUB_OUTPUT
              echo "should_run_tech=true" >> $GITHUB_OUTPUT
              echo "should_run_intel=true" >> $GITHUB_OUTPUT
              echo "[Decide] 提升期: 12:30 UTC 运行 data/domain/tech/intel（promo 由 ops-extra geo 负责）"
            fi

            # workflow_dispatch 的 all 也全部运行
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "should_run_data=true" >> $GITHUB_OUTPUT
              echo "should_run_domain=true" >> $GITHUB_OUTPUT
              echo "should_run_tech=true" >> $GITHUB_OUTPUT
              echo "should_run_promo=true" >> $GITHUB_OUTPUT
              echo "should_run_intel=true" >> $GITHUB_OUTPUT
            fi
          else
            # 单独指定 pipeline
            case "$PIPELINE" in
              data-accumulation) echo "should_run_data=true" >> $GITHUB_OUTPUT ;;
              domain-expansion) echo "should_run_domain=true" >> $GITHUB_OUTPUT ;;
              tech-adoption) echo "should_run_tech=true" >> $GITHUB_OUTPUT ;;
              promotion) echo "should_run_promo=true" >> $GITHUB_OUTPUT ;;
              intelligence) echo "should_run_intel=true" >> $GITHUB_OUTPUT ;;
            esac
          fi

          echo "[Decide] Pipeline=$PIPELINE, Dry-Run=$DRY_RUN"
          cat $GITHUB_OUTPUT

  # ==================== 闭环一：数据积累流水线 ====================
  data-accumulation:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_run_data == 'true'
    # 14 站深度采集实测约 10 分钟（检索词并发 3）；留足余量，避免超时把整轮数据丢掉
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 注意：此处刻意不缓存 STATE_DIR。分页游标 state/backfill-cursor.json 由 git 提交，
      # 是唯一真相；若一并从缓存恢复，restore-keys 兜底命中旧缓存时会把游标覆盖回退，
      # 导致重复抓取同一页、新增归零。
      - name: Restore cached reports/logs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.REPORTS_DIR }}
            ${{ env.LOGS_DIR }}
          key: genetech-ops-reports-${{ github.run_id }}
          restore-keys: |
            genetech-ops-reports-

      - name: Run Data Backfill Pipeline
        run: |
          # 扩量引擎（operations-plan/pipeline-data-backfill.js）：
          #   10 个数据源（OpenAlex/arXiv/Crossref/SemanticScholar/EuropePMC/PubMed/DOAJ/DataCite/Zenodo/CORE）× 单页 100 条 ×
          #   "站点×检索词"级游标 —— 30 站、每站 14 个细分子领域词，单轮单站可取数千原始候选、去重后新增数百~上千。
          #   提速靠"抓得深"而非"抓得勤"（见 operations-plan/RATE-LIMIT-BUDGET.md）：
          #   --limit=800      单轮每站新增上限（检索词在并发 3 下都能被遍历）
          #   --per-page=200   各源单页最大取数（OpenAlex/Crossref/arXiv/S2/EuropePMC/CORE/PubMed 均支持 ≥200）
          #   --max-entities=10000  每站目标容量。单条约 1.1KB，10000 条约 11MB，30 站全满 ≈ 330MB；
          #                    加结构化索引后总产物仍安全低于 GitHub Pages 1GB 上限；达标站点自动跳过抓取
          #   --pages=3      每个检索词每轮连翻 3 页（默认），配合逐页持久化游标，单轮产出较旧版 ~3-5×，且部分运行也不丢进度
          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            node ${{ env.SCRIPTS_DIR }}/pipeline-data-backfill.js --dry-run --limit=800 --per-page=200 --max-entities=10000 --pages=3 --max-minutes=45
          else
            node ${{ env.SCRIPTS_DIR }}/pipeline-data-backfill.js --limit=800 --per-page=200 --max-entities=10000 --pages=3 --max-minutes=45 2>&1 | tee /tmp/backfill.log
          fi
          # 提取本轮新增实体数，供后续 Cloudflare 构建预算守门判定
          ADDED=$(grep -oP '新增实体合计 \K[0-9]+' /tmp/backfill.log 2>/dev/null | tail -1)
          echo "BACKFILL_ADDED=${ADDED:-0}" >> $GITHUB_ENV
          echo "本轮新增实体: ${ADDED:-0}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-accumulation-reports
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.LOGS_DIR }}/
            ${{ env.STATE_DIR }}/
          retention-days: 30

      - name: Commit data updates
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git config --local user.email "ops-bot@genetech.example"
          git config --local user.name "GeneTech Ops Bot"
          git add sites/ reports/ logs/ state/ data/ '*/website/api' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # ===== Cloudflare Pages 构建预算守门 =====
          # 本账号下 5 个项目共用 CF Pages 免费额度 500 builds/月（账号级共享）。
          # 每 30 分钟采集 48 次/天，若每次都触发构建 => 1440 次/月，会拖垮全部项目部署。
          # 策略：数据照常入库（每轮都提交），但仅在「距上次发布 >= 4 小时」时才发出
          # 触发构建的提交；其余提交打 [CI Skip] 标记，CF 跳过构建。
          # => 构建上限约 6 次/天 ≈ 180 次/月，给其余 4 个项目留出 320 次余量。
          # 注意：这里刻意不用「新增条数」做触发条件。加入游标分页后单轮新增约 1700 条，
          # 任何合理的条数阈值都会每轮命中，守门会形同虚设，必须用时间节流。
          git fetch --deepen=100 2>/dev/null || true
          LAST_PUB=$(git log --format='%at|%s' -100 2>/dev/null | grep -v '\[CI Skip\]' | head -1 | cut -d'|' -f1)
          NOW=$(date -u +%s)
          if [[ -n "$LAST_PUB" ]]; then HOURS=$(( (NOW - LAST_PUB) / 3600 )); else HOURS=99; fi
          ADDED="${BACKFILL_ADDED:-0}"
          echo "[Budget] 本轮新增=${ADDED} 距上次发布=${HOURS}h"

          if [[ "$HOURS" -ge 4 ]]; then
            MSG="[Bot] Data backfill update (+${ADDED} entities) $(date -u +%Y-%m-%d-%H:%M:%S UTC)"
            echo "[Budget] 距上次发布 ${HOURS}h >= 4h，触发 Cloudflare 构建发布"
          else
            MSG="[Bot] Data backfill accumulate (+${ADDED}) [CI Skip] $(date -u +%Y-%m-%d-%H:%M:%S UTC)"
            echo "[Budget] 攒批模式，跳过 CF 构建（省额度）"
          fi

          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase --autostash 2>/dev/null || true; if git push; then break; fi; sleep 10; done
        continue-on-error: true

  # ==================== 闭环二：领域开拓机制 ====================
  domain-expansion:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_run_domain == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached state
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STATE_DIR }}
            ${{ env.REPORTS_DIR }}
            ${{ env.LOGS_DIR }}
          key: genetech-ops-state-${{ github.run_id }}
          restore-keys: |
            genetech-ops-state-

      - name: Run Domain Expansion Pipeline
        run: |
          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            node ${{ env.SCRIPTS_DIR }}/pipeline-domain-expansion.js --dry-run
          else
            node ${{ env.SCRIPTS_DIR }}/pipeline-domain-expansion.js
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-expansion-reports
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.LOGS_DIR }}/
            ${{ env.STATE_DIR }}/
          retention-days: 30

      - name: Commit new site scaffolds
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git config --local user.email "ops-bot@genetech.example"
          git config --local user.name "GeneTech Ops Bot"
          git add sites/ reports/ logs/ state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[Bot] Domain expansion update $(date -u +%Y-%m-%d-%H:%M:%S UTC)"
            for i in 1 2 3; do git pull --rebase --autostash 2>/dev/null || true; if git push; then break; fi; sleep 10; done
          fi
        continue-on-error: true

  # ==================== 闭环三：技术采纳闭环 ====================
  tech-adoption:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_run_tech == 'true'
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached state
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STATE_DIR }}
            ${{ env.REPORTS_DIR }}
            ${{ env.LOGS_DIR }}
            poc/
          key: genetech-ops-state-${{ github.run_id }}
          restore-keys: |
            genetech-ops-state-

      - name: Run Tech Adoption Pipeline
        run: |
          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            node ${{ env.SCRIPTS_DIR }}/pipeline-tech-adoption.js --dry-run
          else
            node ${{ env.SCRIPTS_DIR }}/pipeline-tech-adoption.js
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports, logs and PoC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-adoption-reports
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.LOGS_DIR }}/
            ${{ env.STATE_DIR }}/
            poc/
          retention-days: 30

      - name: Create issue for adopted technologies
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          # 如果有新技术被采纳，创建 GitHub Issue 提醒人工审核
          if [ -f "${{ env.STATE_DIR }}/adopted-technologies.json" ]; then
            COUNT=$(node -e "const a=require('./${{ env.STATE_DIR }}/adopted-technologies.json'); console.log(a.filter(x=>!x.appliedToProduction).length)")
            if [ "$COUNT" -gt 0 ]; then
              gh issue create \
                --title "[Tech Adoption] $COUNT 项新技术待审核集成" \
                --body "pipeline-tech-adoption 检测到 $COUNT 项新技术通过 PoC 测试，已生成 patch，请人工审核后集成到生产 pipeline。" \
                --label "automation,tech-adoption"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==================== 闭环四：推广技术应用 ====================
  promotion:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_run_promo == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached state
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STATE_DIR }}
            ${{ env.REPORTS_DIR }}
            ${{ env.LOGS_DIR }}
            promotion-assets/
          key: genetech-ops-state-${{ github.run_id }}
          restore-keys: |
            genetech-ops-state-

      - name: Run Promotion Pipeline
        run: |
          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            node ${{ env.SCRIPTS_DIR }}/pipeline-geo-promotion.js --dry-run
          else
            node ${{ env.SCRIPTS_DIR }}/pipeline-geo-promotion.js
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://lm203688.github.io/genetech-14-sites' }}

      - name: Upload reports and promotion assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-reports
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.LOGS_DIR }}/
            ${{ env.STATE_DIR }}/
            promotion-assets/
          retention-days: 30

      - name: Commit SEO updates
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git config --local user.email "ops-bot@genetech.example"
          git config --local user.name "GeneTech Ops Bot"
          git add content/ reports/ logs/ state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[Bot] Promotion & SEO update $(date -u +%Y-%m-%d-%H:%M:%S UTC)"
            for i in 1 2 3; do git pull --rebase --autostash 2>/dev/null || true; if git push; then break; fi; sleep 10; done
          fi
        continue-on-error: true

  # ==================== 闭环五：竞品情报收集 ====================
  intelligence:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_run_intel == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cached state
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STATE_DIR }}
            ${{ env.REPORTS_DIR }}
            ${{ env.LOGS_DIR }}
          key: genetech-ops-state-${{ github.run_id }}
          restore-keys: |
            genetech-ops-state-

      - name: Run Intelligence Pipeline
        run: |
          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            node ${{ env.SCRIPTS_DIR }}/pipeline-intelligence.js --dry-run
          else
            node ${{ env.SCRIPTS_DIR }}/pipeline-intelligence.js
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-reports
          path: |
            ${{ env.REPORTS_DIR }}/
            ${{ env.LOGS_DIR }}/
            ${{ env.STATE_DIR }}/
          retention-days: 30

      - name: Commit intelligence reports
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git config --local user.email "ops-bot@genetech.example"
          git config --local user.name "GeneTech Ops Bot"
          git add reports/ logs/ state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[Bot] Intelligence update $(date -u +%Y-%m-%d-%H:%M:%S UTC)"
            for i in 1 2 3; do git pull --rebase --autostash 2>/dev/null || true; if git push; then break; fi; sleep 10; done
          fi
        continue-on-error: true

  # ==================== 失败通知 ====================
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [data-accumulation, domain-expansion, tech-adoption, promotion, intelligence]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Create failure issue
        run: |
          gh issue create \
            --title "[Ops Alert] Pipeline 执行失败 ${{ github.run_id }}" \
            --body "运营自动化 pipeline 执行失败，请检查 Actions 日志。\n\n- Run ID: ${{ github.run_id }}\n- Event: ${{ github.event_name }}\n- Ref: ${{ github.ref }}\n\n查看日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ops-alert,failure"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==================== 成功汇总（可选） ====================
  summary:
    runs-on: ubuntu-latest
    needs: [data-accumulation, domain-expansion, tech-adoption, promotion, intelligence]
    if: always() && github.event_name == 'workflow_dispatch'
    steps:
      - name: Operations Summary
        run: |
          echo "=== GeneTech Operations Summary ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"
          echo ""
          echo "Pipeline Status:"
          echo "  Data Accumulation: ${{ needs.data-accumulation.result || 'skipped' }}"
          echo "  Domain Expansion: ${{ needs.domain-expansion.result || 'skipped' }}"
          echo "  Tech Adoption: ${{ needs.tech-adoption.result || 'skipped' }}"
          echo "  Promotion: ${{ needs.promotion.result || 'skipped' }}"
          echo "  Intelligence: ${{ needs.intelligence.result || 'skipped' }}"
