# GeneTech Intel State Dump
# Sprint 2: 每小时从 Worker 导出 memory 状态到 data/intel_state.json
#
# 触发方式：
#   1. 定时：每小时整点（与 data-accumulation 错峰 5 分钟）
#   2. 手动：GitHub → Actions → Intel State Dump → Run workflow
#
# 设计要点：
#   - 用 Contents API 推送（不用 git push），符合本仓库 gh_push 惯例
#   - 需要 permissions: contents: write（GitHub Actions 默认已给）
#
name: Intel State Dump

on:
  schedule:
    - cron: '5 * * * *'  # 每小时 :05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for baseline SHA comparison only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dump state from Worker and push via Contents API
        env:
          INTEL_ADMIN_KEY: ${{ secrets.INTEL_ADMIN_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: lm203688/genetech-14-sites
          BRANCH: master
        run: |
          echo "Fetching intel state from Worker..."
          node operations-plan/pipeline-intel-state-dump.mjs

          # 用 Contents API 更新 data/intel_state.json（不用 git push，兼容沙箱环境）
          set -euo pipefail
          node - <<'NODE'
          import { readFileSync } from 'node:fs';
          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.REPO;
          const branch = process.env.BRANCH;
          const path = 'data/intel_state.json';
          const content = readFileSync(path, 'utf8');
          const sha = process.env.BASELINE_SHA || '';

          // 查当前 SHA（如果没找到，创建；找到了则更新）
          const enc = Buffer.from(content, 'utf8').toString('base64');
          const url = `https://api.github.com/repos/${repo}/contents/${path}`;
          const get = await fetch(url + '?ref=' + branch, {
            headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' },
          });
          let body;
          if (get.ok) {
            body = {
              message: `chore(intel): dump state at ${new Date().toISOString()}`,
              content: enc,
              branch,
            };
            const gjson = await get.json();
            if (gjson.sha) body.sha = gjson.sha;
          } else {
            // 404 → 新文件
            body = {
              message: `chore(intel): initial state dump ${new Date().toISOString()}`,
              content: enc,
              branch,
            };
          }

          const put = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
            body: JSON.stringify(body),
          });
          const pjson = await put.json();
          console.log('PUT', put.status, put.ok ? 'ok' : JSON.stringify(pjson).slice(0, 300));
          if (!put.ok) process.exit(3);
          NODE
