<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GeneTech 知识图谱 · 交互式关系网</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root { --bg:#0f1419;--surface:#1a1f2e;--border:#2d3748;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
#header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;}
#header h1{font-size:18px;font-weight:600;}
#header .stats{font-size:12px;color:var(--muted);}
#controls{position:fixed;top:60px;left:16px;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;width:240px;max-height:calc(100vh - 80px);overflow-y:auto;}
#controls h3{font-size:13px;margin-bottom:12px;color:var(--accent);}
#controls label{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0;cursor:pointer;}
#controls input[type="checkbox"]{accent-color:var(--accent);}
#legend{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
#legend div{display:flex;align-items:center;gap:8px;font-size:11px;margin:4px 0;}
#legend .dot{width:10px;height:10px;border-radius:50%;}
#detail{position:fixed;right:16px;top:60px;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;z-index:100;display:none;max-height:calc(100vh - 80px);overflow-y:auto;}
#detail h2{font-size:16px;margin-bottom:8px;color:var(--accent);}
#detail .meta{font-size:12px;color:var(--muted);margin-bottom:12px;}
#detail .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
#detail .tag{background:var(--border);padding:2px 8px;border-radius:999px;font-size:11px;}
#close-detail{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}
#svg-container{width:100vw;height:100vh;}
.tooltip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:200;display:none;}
</style>
</head>
<body>
<div id="header"><h1>GeneTech Knowledge Graph</h1><span class="stats" id="stats"></span></div>
<div id="controls">
  <h3>Domain Filter</h3>
  <div id="filters"></div>
  <div id="legend"></div>
  <button onclick="resetZoom()" style="margin-top:12px;width:100%;padding:8px;background:var(--accent);color:#000;border:none;border-radius:6px;cursor:pointer;font-size:12px;">Reset View</button>
</div>
<div id="detail">
  <button id="close-detail">×</button>
  <h2 id="detail-name"></h2>
  <div class="meta" id="detail-meta"></div>
  <div id="detail-edges"></div>
  <div class="tags" id="detail-tags"></div>
</div>
<div id="svg-container"></div>
<div class="tooltip" id="tooltip"></div>
<script>
const DOMAIN_COLORS={
  'genetech.tools':'#f59e0b',
  'quantum.genetech.tools':'#8b5cf6',
  'brain.genetech.tools':'#ec4899',
  'robot.genetech.tools':'#06b6d4',
  'energy.genetech.tools':'#10b981',
  'nuclear.genetech.tools':'#ef4444',
  'exo.genetech.tools':'#f97316',
  'life.genetech.tools':'#84cc16',
  'deepsea.genetech.tools':'#14b8a6',
  'mineral.genetech.tools':'#a855f7',
  'agent.genetech.tools':'#3b82f6'
};

let graphData={nodes:[],edges:[]},simulation,svg,g,zoom;

async function loadData(){
  try{
    const r=await fetch('/genetech-14-sites/data/knowledge-graph-entities.json');
    graphData=await r.json();
  }catch(e){
    graphData={nodes:[],edges:[]};
  }
  initVis();
}

function initVis(){
  const w=window.innerWidth,h=window.innerHeight;
  document.getElementById('stats').textContent='Nodes: '+graphData.nodes.length+' | Edges: '+graphData.edges.length;
  
  svg=d3.select('#svg-container').append('svg').attr('width',w).attr('height',h);
  zoom=d3.zoom().scaleExtent([0.1,4]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);
  g=svg.append('g');
  
  simulation=d3.forceSimulation(graphData.nodes)
    .force('link',d3.forceLink(graphData.edges).id(d=>d.id).distance(100))
    .force('charge',d3.forceManyBody().strength(-50))
    .force('center',d3.forceCenter(w/2,h/2))
    .force('collision',d3.forceCollide().radius(20));
  
  g.append('g').selectAll('line').data(graphData.edges).enter()
    .append('line')
    .attr('stroke','#3d4a5c')
    .attr('stroke-width',d=>Math.sqrt(d.weight)*0.3)
    .attr('stroke-opacity',0.4);
  
  const node=g.append('g').selectAll('circle').data(graphData.nodes).enter()
    .append('circle')
    .attr('r',5)
    .attr('fill',d=>DOMAIN_COLORS[d.domain]||'#6b7280')
    .attr('stroke','#fff')
    .attr('stroke-width',0.5)
    .call(drag(simulation))
    .on('click',showDetail)
    .on('mouseover',showTip)
    .on('mouseout',hideTip);
  
  simulation.on('tick',()=>{
    g.selectAll('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('cx',d=>d.x).attr('cy',d=>d.y);
  });
  
  initFilters();
}

function initFilters(){
  const domains=[...new Set(graphData.nodes.map(n=>n.domain))];
  const fd=document.getElementById('filters'),ld=document.getElementById('legend');
  
  domains.forEach(domain=>{
    const c=graphData.nodes.filter(n=>n.domain===domain).length;
    const col=DOMAIN_COLORS[domain]||'#6b7280';
    const lb=document.createElement('label');
    lb.innerHTML='<input type="checkbox" checked data-domain="'+domain+'"> '+domain+' ('+c+')';
    fd.appendChild(lb);
    const li=document.createElement('div');
    li.innerHTML='<span class="dot" style="background:'+col+'"></span> '+domain;
    ld.appendChild(li);
  });
  
  fd.addEventListener('change',e=>{
    if(e.target.type==='checkbox')updateVisibility();
  });
}

function updateVisibility(){
  const cs=new Set();
  document.querySelectorAll('#filters input:checked').forEach(cb=>cs.add(cb.dataset.domain));
  node.attr('opacity',d=>cs.has(d.domain)?1:0.1);
  g.selectAll('line').attr('opacity',d=>{
    const sd=d.source.domain||d.source.id,td=d.target.domain||d.target.id;
    return(cs.has(sd)&&cs.has(td))?0.4:0.05;
  });
}

function showDetail(event,d){
  const det=document.getElementById('detail');
  document.getElementById('detail-name').textContent=d.name||d.id;
  document.getElementById('detail-meta').innerHTML=
    '<div>Domain: '+d.domain+'</div>'+
    '<div>Type: '+(d.category||'N/A')+'</div>'+
    '<div>ID: '+d.id+'</div>';
  
  const re=graphData.edges.filter(e=>e.source.id===d.id||e.target.id===d.id);
  const ed=document.getElementById('detail-edges');
  ed.innerHTML='<h4 style="margin:12px 0 8px;font-size:13px;">Related ('+re.length+')</h4>';
  re.slice(0,10).forEach(e=>{
    const o=e.source.id===d.id?e.target:e.source;
    const p=document.createElement('p');
    p.style.cssText='font-size:11px;color:var(--muted);margin:4px 0;';
    p.textContent=(o.name||o.id)+' ('+(e.relation||'co-occurrence')+', w='+e.weight+')';
    ed.appendChild(p);
  });
  
  const td=document.getElementById('detail-tags');
  td.innerHTML='';
  (d.tags||[]).forEach(t=>{
    const s=document.createElement('span');
    s.className='tag';
    s.textContent=t;
    td.appendChild(s);
  });
  
  det.style.display='block';
}

function showTip(event,d){
  const t=document.getElementById('tooltip');
  t.style.display='block';
  t.style.left=(event.pageX+10)+'px';
  t.style.top=(event.pageY-10)+'px';
  t.innerHTML='<strong>'+(d.name||d.id)+'</strong><br><span style="color:var(--muted)">'+(d.domain||'')+'</span>';
}

function hideTip(){document.getElementById('tooltip').style.display='none';}

function drag(sim){
  function s(e,d){if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;}
  function d(e,d){d.fx=e.x;d.fy=e.y;}
  function en(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}
  return d3.drag().on('start',s).on('drag',d).on('end',en);
}

function resetZoom(){
  svg.transition().duration(750).call(zoom.transform,d3.zoomIdentity);
}

document.getElementById('close-detail').addEventListener('click',()=>{
  document.getElementById('detail').style.display='none';
});

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  svg.attr('width',w).attr('height',h);
  simulation.force('center',d3.forceCenter(w/2,h/2));
  simulation.alpha(0.3).restart();
});

loadData();
</script>
</body>
</html>
