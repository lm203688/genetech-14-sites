<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GeneTech 14站 · 领域图谱仪表盘</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --blue:#2563eb; --teal:#0d9488; --green:#16a34a;
    --amber:#d97706; --red:#dc2626; --bar:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding:28px;}
  .wrap{max-width:1080px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .k{font-size:12px;color:var(--muted);}
  .card .v{font-size:26px;font-weight:700;margin-top:4px;}
  .card .v small{font-size:13px;font-weight:500;color:var(--muted);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px;}
  .panel h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .controls input,.controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink);}
  .controls input{flex:1;min-width:180px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
  .bar-name{width:170px;flex:none;text-align:right;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:#eef2f7;border-radius:6px;height:18px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:6px;}
  .bar-val{width:62px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);}
  .src-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 22px;}
  .src{display:flex;align-items:center;gap:8px;font-size:13px;}
  .src .nm{width:120px;flex:none;color:var(--muted);}
  .src .tr{flex:1;background:#eef2f7;border-radius:5px;height:12px;overflow:hidden;}
  .src .tf{height:100%;background:var(--teal);}
  .src .pc{width:54px;flex:none;text-align:right;font-variant-numeric:tabular-nums;}
  .qual{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .q{text-align:center;}
  .ring{--p:0;width:84px;height:84px;border-radius:50%;margin:0 auto 6px;
    background:conic-gradient(var(--c) calc(var(--p)*1%),#eef2f7 0);display:flex;align-items:center;justify-content:center;}
  .ring span{background:var(--card);width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .q .lab{font-size:12px;color:var(--muted);}
  .note{font-size:12px;color:var(--muted);margin-top:10px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;}
  .b-red{background:#fee2e2;color:var(--red);} .b-amb{background:#fef3c7;color:var(--amber);} .b-grn{background:#dcfce7;color:var(--green);}
  @media(max-width:720px){.cards,.qual{grid-template-columns:repeat(2,1fr);} .src-grid{grid-template-columns:1fr;} .bar-name{width:110px;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>GeneTech 14站 · 领域图谱仪表盘</h1>
  <div class="sub">把「14+ 域做深不做浅」做成可见卖点 · 数据源 <code>state/db-health-history.json</code> · 快照日期 <span id="snap">—</span></div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>🔬 22 站实体分布（可排序 / 筛选）</h2>
    <div class="controls">
      <input id="q" placeholder="筛选领域（如 bio / quantum / 合成）…" />
      <select id="sort">
        <option value="count-desc">按实体数 ↓</option>
        <option value="count-asc">按实体数 ↑</option>
        <option value="name-asc">按名称 A→Z</option>
      </select>
    </div>
    <div id="bars"></div>
  </div>

  <div class="panel">
    <h2>📚 来源分布（跨 8 源）</h2>
    <div class="src-grid" id="src"></div>
  </div>

  <div class="panel">
    <h2>🩺 数据质量红线</h2>
    <div class="qual" id="qual"></div>
    <div class="note">DOI 可溯源 0% = 管线 DOI 捕获修复尚未部署（见项目梳理报告 §4.5）；摘要 47% 偏低，影响 RAG 召回质量，需补抓 abstract。</div>
  </div>
</div>

<script>
// 嵌入快照（兜底；若经 GitHub Pages 打开则 fetch 最新 state/db-health-history.json 覆盖）
const SNAPSHOT = {
  date:"2026-08-18", total:49879, sites:22,
  perSite:{
    "agent-ecosystem":2423,"ai4science":2216,"alien-minerals":2774,"biocomputing":4767,
    "bionic-ai":2171,"brain-science":2504,"deep-sea-tech":2227,"embodied-ai":2961,
    "exo-science":2219,"genetech-tools":1581,"life-science":1974,"low-altitude":1942,
    "new-energy":2621,"nuclear-energy":2247,"privacy-computing":1310,"quantum-computing":2553,
    "robot-parts":1458,"sat-6g":1393,"semiconductor":2280,"spatial-computing":1258,
    "synbio-manufacturing":2711,"tcm-tools":2289
  },
  quality:{urlCompleteness:99,abstractCompleteness:47,doiTraceability:0,dedupRate:97,uniqueKeys:48249},
  bySource:{arxiv:8684,openalex:8573,crossref:12093,pubmed:6106,europepmc:12679,semanticscholar:671,datacite:442,preprints:631}
};

function render(d){
  document.getElementById('snap').textContent = d.date;
  const q=d.quality;
  const cards=[
    {k:"总实体",v:d.total.toLocaleString()},
    {k:"领域站点",v:d.sites},
    {k:"DOI 可溯源",v:q.doiTraceability+"%",badge:q.doiTraceability<10?'<span class="badge b-red">⚠ 红线</span>':'<span class="badge b-grn">OK</span>'},
    {k:"摘要完整",v:q.abstractCompleteness+"%",badge:q.abstractCompleteness<60?'<span class="badge b-amb">偏低</span>':'<span class="badge b-grn">OK</span>'}
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>
    `<div class="card"><div class="k">${c.k}</div><div class="v">${c.v} ${c.badge||''}</div></div>`).join('');

  const max=Math.max(...Object.values(d.perSite));
  const entries=Object.entries(d.perSite);
  function draw(filter,sort){
    let arr=entries.filter(([n])=>n.toLowerCase().includes(filter.toLowerCase()));
    if(sort==='count-desc')arr.sort((a,b)=>b[1]-a[1]);
    else if(sort==='count-asc')arr.sort((a,b)=>a[1]-b[1]);
    else arr.sort((a,b)=>a[0].localeCompare(b[0]));
    document.getElementById('bars').innerHTML=arr.map(([n,v])=>{
      const pct=Math.round(v/max*100);
      return `<div class="bar-row"><div class="bar-name" title="${n}">${n}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-val">${v.toLocaleString()}</div></div>`;
    }).join('') || '<div class="note">无匹配领域。</div>';
  }
  const qEl=document.getElementById('q'), sEl=document.getElementById('sort');
  qEl.oninput=()=>draw(qEl.value,sEl.value);
  sEl.onchange=()=>draw(qEl.value,sEl.value);
  draw('','count-desc');

  const tot=Object.values(d.bySource).reduce((a,b)=>a+b,0);
  document.getElementById('src').innerHTML=Object.entries(d.bySource).sort((a,b)=>b[1]-a[1]).map(([n,v])=>{
    const pct=Math.round(v/tot*100);
    return `<div class="src"><div class="nm">${n}</div><div class="tr"><div class="tf" style="width:${pct}%"></div></div><div class="pc">${pct}%</div></div>`;
  }).join('');

  const qs=[
    {l:"溯源 URL 完整",v:q.urlCompleteness,c:"var(--green)"},
    {l:"摘要完整",v:q.abstractCompleteness,c:"var(--amber)"},
    {l:"DOI 可溯源",v:q.doiTraceability,c:"var(--red)"},
    {l:"跨源去重率",v:q.dedupRate,c:"var(--blue)"}
  ];
  document.getElementById('qual').innerHTML=qs.map(x=>
    `<div class="q"><div class="ring" style="--p:${x.v};--c:${x.c}"><span>${x.v}%</span></div><div class="lab">${x.l}</div></div>`).join('');
}

render(SNAPSHOT);
// 优先取线上最新快照（GitHub Pages 下 ../state/... 可达）
fetch('../state/db-health-history.json').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.perSite)render(j);}).catch(()=>{});
</script>
</body>
</html>
